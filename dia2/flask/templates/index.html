<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera app con Jinja</title>
</head>

<body>
    <h1>Mi primera página con HTML, Flask y Jinja</h1>

    <form action="/suma" method="POST">

        +

</body>

</html>
